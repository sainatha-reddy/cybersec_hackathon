[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packetdoctor"
version = "1.0.0"
description = "Diagnose network faults and attacks from packet captures, explained in plain language."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "scapy==2.8.0",
    "typer==0.27.3",
    "rich==15.0.0",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.33",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
packetdoctor = "packetdoctor.cli:main"

[tool.setuptools.packages.find]
include = ["packetdoctor*", "samples*"]

[tool.setuptools.package-data]
packetdoctor = ["web/static/*", "web/templates/*"]
samples = ["*.pcap", "*.pcapng"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
