[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packetdoctor"
version = "1.0.0"
description = "Diagnose network faults and attacks from packet captures, explained in plain language."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "scapy>=2.5",
    "typer>=0.12",
    "rich>=13",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
packetdoctor = "packetdoctor.cli:main"

[tool.setuptools.packages.find]
include = ["packetdoctor*"]

[tool.setuptools.package-data]
packetdoctor = ["web/static/*", "web/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
